
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noteed — Ideas Captured, Creativity Unleashed.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.20.0",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
  }
}
</script>
    <style>
      :root {
        --bg: #FFFFFF;
        --accent-pink: #EC4899;
        --accent-purple: #8B5CF6;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        color: #111827;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3 { font-family: 'Outfit', sans-serif; letter-spacing: -0.04em; color: #000; }
      
      .gradient-blob {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
        filter: blur(80px);
        z-index: -1;
      }

      .feature-card {
        background: #FFFFFF;
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 24px;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
      }

      .feature-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
      }

      .btn-black {
        background: #000000;
        color: #FFFFFF;
        transition: all 0.2s ease;
      }
      .btn-black:hover {
        background: #222;
        transform: scale(1.02);
      }

      .ticker-container {
        mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }

      .accordion-item {
        background: #FDF2F8;
        border-radius: 16px;
        transition: all 0.3s ease;
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f9f9f9; }
      ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(1deg); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
